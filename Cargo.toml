[package]
name = "pid-manager"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "PID file management with RAII cleanup and process liveness checks"
repository = "https://github.com/WyattAu/pid-manager"
keywords = ["pid", "daemon", "process", "pidfile"]
categories = ["os", "filesystem"]

[dependencies]
nix = { version = "0.29", features = ["signal", "fs"] }
thiserror = "2"
serde = { version = "1", features = ["derive"], optional = true }

[dev-dependencies]
tempfile = "3"
proptest = "1"
